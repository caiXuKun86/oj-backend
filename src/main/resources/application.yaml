spring:
  application:
    name: oj-backend
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true




